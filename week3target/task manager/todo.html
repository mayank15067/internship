<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK MANAGER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="todo.css">
</head>
<body >
    <h1 id="head"> TASK MANAGER </h1>
    <div class="p-4 bg-light text-dark shadow-lg mb-5 bg-body rounded" style="width: 90%;">
    
    <div class="input-group mb-3">
  <input type="text" placeholder="ENTER TASK TO ADD " class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default" id="input" type="text">
<button class="btn btn-primary btn-sm" id="task"> ADD TASK </button>    
</div>
    <div class="table-responsive">
    <table id="table"class="table table-borderless align-middle" >
        <thead>
            <tr id="headrow">
                <th></th>
                <th>TASK</th>
                <th>STATUS</th>
                <th></th>
            </tr>
            </thead>
        <tbody>
            <tr>
                <td class="complete"><i class="fa-solid fa-thumbs-up"></i></td>
                <td class="work">HOMEWORK</td>
                <td class="status">PENDING</td>
                <td class="delete"><i class="fa-solid fa-xmark"></i></td>
            </tr>
            <tr>
                <td class="complete"><i class="fa-solid fa-thumbs-up"></i></td>
                <td class="work">MEDITATION</td>
                <td class="status">PENDING</td>
                <td class="delete"><i class="fa-solid fa-xmark"></i></td>
            </tr>
            <tr>
                <td class="complete"><i class="fa-solid fa-thumbs-up"></i></td>
                <td class="work">LUNCH</td>
                <td class="status">PENDING</td>
                <td class="delete"><i class="fa-solid fa-xmark"></i></td>
            </tr>
            <tr>
                <td class="complete"><i class="fa-solid fa-thumbs-up"></i></td>
                <td class="work">READ BOOK</td>
                <td class="status">PENDING</td>
                <td class="delete"><i class="fa-solid fa-xmark"></i></td>
            </tr>
        </tbody>
</table>
</div>
</div>
<script src="todo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
